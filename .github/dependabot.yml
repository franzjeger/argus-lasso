version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # Batch minor/patch bumps into one PR to keep noise down;
      # major (potentially breaking) bumps still get individual PRs.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # ci.yml pins this action's ref to the minimum supported Rust
      # (rust-version in Cargo.toml); it is a toolchain, not an action
      # version, and only moves when the MSRV does.
      - dependency-name: dtolnay/rust-toolchain
