version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # bincode 3.0.0 is a tombstone: its lib.rs is only a compile_error!
      # (the project is no longer developed). 1.3.3 is the last working one.
      - dependency-name: bincode
        versions: [">= 3"]
    groups:
      # Batch minor/patch bumps into one PR to keep noise down;
      # major (potentially breaking) bumps still get individual PRs.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Actions are pinned by commit SHA with the version in a comment, which
    # Dependabot keeps up to date.
    ignore:
      # Pinned to a commit on its master branch: it publishes no versions,
      # so there is nothing for Dependabot to compare. Updated by hand.
      - dependency-name: dtolnay/rust-toolchain
