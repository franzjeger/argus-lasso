name: Security audit

on:
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  schedule:
    # Weekly, so new RUSTSEC advisories against existing deps are caught
    # even when the lockfile hasn't changed.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2026-0194/0195: quick-xml DoS on untrusted XML, patched
          # only in >= 0.41. All copies are transitive pins from the GUI stack
          # (zbus_xml ^0.38, wayland-scanner ^0.39 — the latter is build-time
          # codegen) and cannot be upgraded from this crate. Not reachable
          # with remote untrusted XML here: only local D-Bus introspection is
          # parsed at runtime. Remove once eframe/zbus deps move to >= 0.41.
          # RUSTSEC-2026-0192: ttf-parser is unmaintained; no vulnerability is
          # known. Its only path is winit -> sctk-adwaita -> ab_glyph, which
          # draws the title text of the GNOME client-side titlebar from system
          # fonts. ab_glyph 0.2.32, the newest, still uses it; avoiding it would
          # mean no title text on GNOME (wayland-csd-adwaita-notitle) or
          # freetype/fontconfig (crossfont). Remove once winit 0.31 or ab_glyph
          # moves to a maintained parser such as skrifa (#33).
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195,RUSTSEC-2026-0192
