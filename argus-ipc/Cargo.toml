[package]
name = "argus-ipc"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
# Wire format: stable since 1.0 and maintained (bincode, used before, is not).
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde_json = "1"
