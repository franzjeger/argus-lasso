[package]
name = "argus-lasso"
version = "1.3.1"
edition = "2021"
# The floor the dependency tree actually imposes — the egui 0.34 stack
# declares 1.92. Enforced by cargo, and checked in CI so it cannot drift
# back into being a guess.
rust-version = "1.92"
description = "Argus-Lasso — Linux process manager with CPU affinity, ProBalance, Gaming Mode, and HW monitoring"
authors = ["franzjeger"]

[[bin]]
name = "argus-lasso"
path = "src/main.rs"

[dependencies]
argus-ipc = { path = "argus-ipc" }
# GUI
# 0.34 flipped the default renderer to wgpu. glow is selected explicitly to
# keep the OpenGL backend this app has always used — wgpu pulls a much larger
# tree and changes the surface eframe hands to the Wayland opacity code.
eframe      = { version = "0.34", default-features = false, features = [
    "accesskit", "default_fonts", "glow", "wayland", "x11",
] }
egui        = "0.34"
egui_extras = "0.34"
# GNOME's Mutter never draws server-side window decorations on Wayland, and
# eframe's "wayland" feature does not enable winit's client-side fallback —
# so on GNOME the window rendered with no titlebar, border, or close button.
# Naming winit here (same version eframe resolves) turns that fallback on via
# feature unification; sctk-adwaita then draws a GNOME-native titlebar.
# KDE/KWin still provides server-side decorations, so nothing changes there.
winit = { version = "0.30", default-features = false, features = [
    "wayland-csd-adwaita",
] }

# Process enumeration

# Syscalls: sched_setaffinity, signal
nix = { version = "0.29", features = ["sched", "process", "signal", "fs"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
toml  = "1.0"

# UUIDs for rule IDs
uuid = { version = "1", features = ["v4"] }

# Regex for rule matching
regex = "1"

# Logging
log        = "0.4"
env_logger = "0.11"

# CLI flags
clap = { version = "4", features = ["derive"] }

# System tray via D-Bus StatusNotifierItem (KDE/freedesktop, no libxdo needed)
# Use async-io backend to avoid needing a Tokio runtime in a non-Tokio app.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

# Multi-producer channels for GUI→daemon commands
crossbeam-channel = "0.5"

# Desktop notifications (D-Bus/zbus, no libnotify)
notify-rust = { version = "4", features = ["z"] }

# JSON (rules export/import)
serde_json = "1"

# NVIDIA GPU monitoring via NVML (no nvidia-smi process spawn)
nvml-wrapper = "0.12"

# Wayland compositor-side opacity via wp_alpha_modifier_v1
# "system" enables Backend::from_foreign_display + ObjectId::from_ptr
wayland-client   = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["staging", "client"] }
wayland-backend  = { version = "0.3",  features = ["client_system"] }
wayland-sys      = { version = "0.31", features = ["client"] }

# Raw window handle (re-export from eframe's transitive dep, pinned to same version)
raw-window-handle = "0.6"

# PNG writing for --ui-tour captures (also a build-dep, for icon embedding)
png = "0.17"
ureq = { version = "3.3.0", features = ["rustls"] }
sha2 = "0.11.0"
minisign-verify = "0.2.5"
bincode = "1.3"

[build-dependencies]
png = "0.17"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true

[workspace]
members = ["argus-ipc",
    "argus-layer"
, "test_nvml"]
