[package]
name = "argus-layer"
version = "0.1.0"
edition = "2021"
authors = ["franzjeger"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Standard ash crate for Vulkan FFI (it gives us access to Vulkan function pointers)
ash = "0.38"
libc = "0.2"
lazy_static = "1.4"
argus-ipc = { path = "../argus-ipc" }
bincode = "1.3"
egui = "0.30"
egui-ash-renderer = { version = "0.13.0" }
gpu-allocator = "0.26"
